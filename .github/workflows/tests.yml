name: tests
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "openai>=1.0" pytest
      - name: Offline unit tests (fake client, no token/network)
        run: python -m pytest tests -q
